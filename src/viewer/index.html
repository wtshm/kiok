<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kiok</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <span class="logo-mark">kiok</span>
        <div class="stats-row" id="stats"></div>
        <nav class="tabs">
          <div class="tab active" data-tab="chunks">Chunks</div>
          <div class="tab" data-tab="sessions">Sessions</div>
        </nav>
        <div class="search-wrap">
          <span class="search-icon">&#8981;</span>
          <input
            class="search-input"
            id="search"
            type="text"
            placeholder="Search..."
          />
          <span class="search-count" id="result-count"></span>
        </div>
      </header>
      <main class="main">
        <div id="content"></div>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
